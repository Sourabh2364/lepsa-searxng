use_default_settings: false

general:
  instance_name: "LEPSA Search Engine"
  enable_metrics: false

search:
  safe_search: 0
  default_lang: "en-IN"
  formats:
    - html
    - json

server:
  secret_key: "lepsa_searxng_ultra_secret_key_99"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

valkey:
  url: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0

engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: reddit
    engine: reddit
    shortcut: re
    disabled: false

  - name: bing images
    engine: bing_images
    shortcut: bii
    disabled: false

  - name: qwant images
    engine: qwant_images
    shortcut: qwi
    disabled: false
    
