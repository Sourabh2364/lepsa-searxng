use_default_settings: true

general:
  instance_name: "LEPSA Search Engine"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en-IN"
  formats:
    - html
    - json

server:
  secret_key: "lepsa_searxng_ultra_secret_key_99"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

valkey:
  url: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0

engines:
  - name: bing
    disabled: false

  - name: yahoo
    disabled: false

  - name: mojeek
    disabled: false

  - name: wikipedia
    disabled: false

  - name: bing images
    disabled: false

  - name: qwant images
    disabled: false

  - name: google
    disabled: true

  - name: google cse
    disabled: true

  - name: brave
    disabled: true

  - name: duckduckgo
    disabled: true
    
