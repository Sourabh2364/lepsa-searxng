use_default_settings: true

general:
  instance_name: "LEPSA Search Engine"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en-IN"
  formats:
    - html
    - json
  # a blocked engine comes back after 10 minutes (default is hours)
  suspended_times:
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 600
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 600

server:
  secret_key: "lepsa_searxng_ultra_secret_key_99"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

valkey:
  url: false

outgoing:
  request_timeout: 9.0
  max_request_timeout: 12.0

engines:
  # yahoo is OFF: from this server it answered "iphone 16" with Windows Bluetooth pages
  - name: yahoo
    disabled: true

  # web (several engines, so one blocked engine does not break search)
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: wikipedia
    disabled: false

  # images
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: qwant images
    disabled: false

  # often blocked from cloud servers
  - name: google
    disabled: true
  - name: google cse
    disabled: true
