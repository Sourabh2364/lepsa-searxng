use_default_settings: true

general:
  instance_name: "LEPSA Search Engine"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en-IN"
  formats:
    - html
    - json

server:
  secret_key: "lepsa_searxng_ultra_secret_key_99"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

valkey:
  url: false

outgoing:
  request_timeout: 6.0
  useragent_suffix: "LEPSA-AI/2.0"

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: duckduckgo images
    engine: duckduckgo_images
    shortcut: ddgi
    disabled: false

  - name: qwant images
    engine: qwant_images
    shortcut: qwi
    disabled: false

  - name: bing images
    engine: bing_images
    shortcut: bii
    disabled: false

  - name: google
    disabled: true

  - name: brave
    disabled: true
    
